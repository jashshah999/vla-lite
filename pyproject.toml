[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvla-compat"
version = "0.1.0"
description = "Run OpenVLA-7B on a modern transformers stack (fixes the silent vision bypass) and on an 8 GB GPU"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jash Shah" }]
keywords = ["openvla", "vla", "robotics", "transformers", "quantization"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5",
  "transformers>=4.50,<5",
  "timm<1.0",
  "accelerate>=1.0",
  "huggingface_hub>=0.30",
  "pillow",
  "numpy",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.45"]
bench = ["psutil", "lerobot>=0.4"]

[project.urls]
Homepage = "https://github.com/jashshah999/vla-lite"
Issues = "https://github.com/jashshah999/vla-lite/issues"

[project.scripts]
openvla-compat-check = "openvla_compat:main"

[tool.setuptools]
py-modules = ["openvla_compat"]
